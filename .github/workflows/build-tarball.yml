name: Build package tarball

on:
  push:
    branches: [ "main" ]
    paths:
      - "rwf/**"                                  # only when the package itself changes
      - ".github/workflows/build-tarball.yml"
  workflow_dispatch:                              # also allows a manual run from the Actions tab

permissions:
  contents: write                                 # needed to publish the release

concurrency:
  group: build-tarball
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the package data is stored in Git LFS; fetch only that, not the docs/PDFs
      - name: Fetch package data from LFS
        run: git lfs pull --include="rwf/data/*"

      - uses: r-lib/actions/setup-r@v2

      - name: Build tarball
        run: |
          rm -f rwf_*.tar.gz                      # drop the old build (also an old version number)
          R CMD build rwf --resave-data --no-build-vignettes --no-manual

      - uses: r-lib/actions/setup-tinytex@v2

      # tlmgr refuses to install anything when the package server has a newer
      # tlmgr than the TinyTeX just installed, so it updates itself first
      - name: Install LaTeX packages for the R manual
        run: |
          tlmgr update --self
          tlmgr install inconsolata upquote makeindex

      - name: Build PDF manual
        run: R CMD Rd2pdf rwf --force --no-preview --output=rwf.pdf

      # the tarball and the manual are not committed: they replace the files of the release
      # "latest", whose tag moves to the commit they were built from. The release is kept, not
      # deleted and created again: Zenodo archives every newly published release, so a new one on
      # each push would mint a DOI each time. Versioned releases (v0.1.0) are the ones for Zenodo.
      - name: Publish tarball and manual to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(rwf_*.tar.gz rwf.pdf)
          if gh release view latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload latest "${files[@]}" --clobber
            # drop files of earlier builds, such as a tarball with an older version number
            gh release view latest --json assets -q '.assets[].name' | while read -r asset; do
              [[ " ${files[*]} " == *" $asset "* ]] || gh release delete-asset latest "$asset" --yes
            done
          else                                  # first build, or the release was deleted
            gh release create latest "${files[@]}" \
              --target "$GITHUB_SHA" --title "Latest build" \
              --notes "Built automatically from main: the source tarball and the PDF manual."
          fi
